<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6efd">
  <title>You're offline | MSMS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 16px;
      padding: 36px 24px;
      box-shadow: 0 8px 30px rgba(13, 110, 253, 0.12);
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e7f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 22px; margin: 0 0 10px; }
    p { margin: 0 0 24px; color: #6b7280; line-height: 1.5; font-size: 15px; }
    button {
      border: 0;
      background: #0d6efd;
      color: #fff;
      font-size: 16px;
      padding: 12px 28px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .status { margin-top: 18px; font-size: 13px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0d6efd"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>We couldn't connect to the MSMS Student Portal. Please check your internet connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="status" id="status">Waiting for connection…</div>
  </div>

  <script>
    window.addEventListener('online', function () {
      document.getElementById('status').textContent = 'Back online, reloading…';
      location.href = '/';
    });
  </script>
</body>
</html>
