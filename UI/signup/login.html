<!doctype html>
<html lang="en" data-theme="corporate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Bengali:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rancho&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
  body {
    font-family: "Poppins", sans-serif;
  }
</style>

  </head>
  <body class="bg-base-200 min-h-screen flex flex-col justify-between">
    
    <!-- main content starts -->

    <main class="flex-grow flex items-center justify-center p-4">
      
      <!-- Login Card Starts -->
      <div class="card bg-base-100 w-full max-w-sm shadow">
        <div class="card-body p-8 gap-6">

          <div class="flex justify-center">
            <img src="img/mathsquadz_Logo.jpeg" alt="Logo" class="w-36 object-contain" />
          </div>

          <div class="text-center">
            <h2 class="text-2xl font-bold tracking-tight">Welcome Back</h2>
            <p class="text-sm text-base-content/60 mt-1">Login to access your account</p>
          </div>

          <fieldset class="fieldset gap-4 p-0">
            
            <label class="input input-lg input-bordered flex items-center gap-3 w-full">
              <svg
                class="h-[1em] opacity-50 shrink-0"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
              >
                <g
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  stroke-width="2.5"
                  fill="none"
                  stroke="currentColor"
                >
                  <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </g>
              </svg>
              <input type="email" placeholder="Email" class="grow" required />
            </label>

            <div class="w-full">
              <label class="input input-lg input-bordered flex items-center gap-3 w-full">
                <svg
                  class="h-[1em] opacity-50 shrink-0"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                >
                  <g
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    stroke-width="2.5"
                    fill="none"
                    stroke="currentColor"
                  >
                    <rect width="16" height="10" x="4" y="11" rx="1"></rect>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
                  </g>
                </svg>
                <input type="password" placeholder="Password" class="grow" required />
              </label>
              
              <div class="text-right mt-2">
                <a href="#" class="link link-hover text-xs text-primary font-medium">Forgot password?</a>
              </div>
            </div>

            <button class="btn btn-primary w-full mt-2 btn-lg">Login</button>
          </fieldset>

        </div>
      </div>
      <!-- Login Card Ends -->

      
    </main>

    <!-- main content ends -->

    <!-- Footer starts -->

    <footer class="footer footer-center bg-base-300 text-base-content p-4 border-t border-base-300">
      <aside>
        <p class="text-sm opacity-80">Copyright © 2026 - All rights reserved by 
          MATHSQUADZ
        </p>
      </aside>
    </footer>

    <!-- Footer ends -->

  </body>
</html>
